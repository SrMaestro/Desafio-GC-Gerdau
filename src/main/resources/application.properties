spring.application.name=Desafio-GC-Gerdau-App
spring.config.import=optional:file:.env[.properties]

spring.datasource.url=jdbc:postgresql://localhost:${DB_PORT}/${DB_NAME}
spring.datasource.username=${DB_USER}
spring.datasource.password=${DB_PASSWORD}
# Sem o perfil demo, um banco que já recebeu os dados de demonstração (db/demo) não pode impedir a subida
spring.flyway.ignore-migration-patterns=*:future,repeatable:missing
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true
spring.jpa.open-in-view=false

# Importação em massa: 10MB comportam milhares de linhas (ver LeitorPlanilha.MAX_LINHAS)
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB
