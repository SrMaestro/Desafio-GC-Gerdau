<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" th:fragment="head(title)">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="_csrf" th:content="${_csrf?.token}">
    <meta name="_csrf_header" th:content="${_csrf?.headerName}">
    <title th:text="${title}">Serviços</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
    <script th:src="@{/js/app.js}" defer></script>
    <script th:src="@{/js/busca.js}" defer></script>
</head>
<body>
<aside class="menu" th:fragment="menu(ativo)">
    <a class="marca" th:href="@{/}">Catálogo de Serviços</a>
    <nav aria-label="Principal">
        <a th:href="@{/}" th:aria-current="${ativo == 'servicos'} ? 'page'">Serviços</a>
        <a th:href="@{/ui/busca}" th:aria-current="${ativo == 'busca'} ? 'page'">Buscar NBS</a>
        <a th:href="@{/ui/importacoes}" th:aria-current="${ativo == 'importar'} ? 'page'">Importar</a>
        <a th:if="${ehAprovador}" th:href="@{/ui/revisao}" th:aria-current="${ativo == 'revisao'} ? 'page'">Revisão</a>
        <a th:if="${ehAprovador}" th:href="@{/ui/aprovacao}" th:aria-current="${ativo == 'aprovacoes'} ? 'page'">Aprovações</a>
    </nav>
    <div class="usuario" th:if="${usuarioLogado}">
        <span class="nome" th:text="${usuarioLogado}" th:title="${usuarioLogado}"></span>
        <form method="post" th:action="@{/logout}"><button type="submit">Sair</button></form>
    </div>
</aside>
</body>
</html>
