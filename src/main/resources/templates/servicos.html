<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{layout :: head('Serviços')}"></head>
<body>
<header><a th:href="@{/}">Catálogo de Serviços</a><a class="nav" th:if="${ehAprovador}" th:href="@{/ui/revisao}">Revisão</a><a class="nav" th:href="@{/ui/importacoes}">Importar</a><th:block th:replace="~{layout :: usuario}"/></header>
<main>
    <div class="topo">
        <div>
            <h1>Serviços</h1>
            <p>Busque pelo nome, área ou código e copie o código padronizado.</p>
        </div>
        <span><a th:href="@{/ui/busca}">Buscar código NBS</a>
            <a class="botao" th:href="@{/ui/servicos/novo}">Novo serviço</a></span>
    </div>

    <input type="search" id="busca" class="busca" aria-label="Buscar serviços" placeholder="Buscar serviço, área, código ou CNAE" autocomplete="off">

    <nav class="filtros" aria-label="Filtrar por área">
        <a class="chip" th:href="@{/}" th:attr="aria-current=${areaSelecionada == null or areaSelecionada == ''} ? 'true' : null">Todas</a>
        <a class="chip" th:each="a : ${areas}" th:href="@{/(area=${a})}" th:text="${a}"
           th:attr="aria-current=${a == areaSelecionada} ? 'true' : null"></a>
    </nav>

    <p class="contador" id="contador" aria-live="polite">
        <span id="contador-n" th:text="${#lists.size(servicos)}">0</span> serviços
    </p>

    <div class="tabela-wrap">
        <table id="tabela-servicos">
            <thead>
            <tr><th>ID</th><th>Área</th><th>Texto breve</th><th>Código padronizado</th><th>CNAE</th><th>Criador</th></tr>
            </thead>
            <tbody>
            <tr th:each="s : ${servicos}" data-linha>
                <td class="id" th:text="${s.id}"></td>
                <td class="area" th:text="${s.areaServico}"></td>
                <td class="titulo"><a th:href="@{/ui/servicos/{id}(id=${s.id})}" th:text="${s.textoBreve}"></a></td>
                <td class="codigo-celula">
                    <span class="codigo">
                        <code th:text="${s.codigoPadronizado}"></code>
                        <button type="button" class="copiar" th:data-codigo="${s.codigoPadronizado}"
                                th:aria-label="'Copiar código ' + ${s.codigoPadronizado}">Copiar</button>
                    </span>
                </td>
                <td class="cnae" th:text="${s.id2Cnae}"></td>
                <td class="criador" th:text="${s.criadorCodigo} ?: '—'"></td>
            </tr>
            <tr class="vazio" th:if="${#lists.isEmpty(servicos)}"><td colspan="6">Nenhum serviço nesta área.</td></tr>
            <tr class="vazio" id="sem-resultados" hidden><td colspan="6">Nenhum serviço corresponde à busca. Tente outro termo.</td></tr>
            </tbody>
        </table>
    </div>
</main>
</body>
</html>
